<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta charset="UTF-8"><title>Monitor Import</title><link rel="stylesheet" href="/styles-v2.css"><script src="/js/hepi-api.js"></script><script src="/js/hepi-auth.js"></script></head><body>
<div id="loginModal" class="sold-modal"><div class="sold-box"><h2>VERIFIKASI AKSES</h2><div class="sold-text">Login admin/adminkantor untuk monitor import.</div><div class="sold-buttons"><button onclick="hepiAuth.login()">Login dengan Google</button></div></div></div>
<div class="siteNav"><nav class="appNav"><a class="appNavLink active" href="/import-monitor" target="_top">Monitor Import</a></nav><button class="headerLogout" onclick="hepiAuth.logout()">Logout</button></div>
<div class="pageWrap"><div id="deniedBox" class="filterBox" style="display:none"><div class="emptyState">Hanya admin atau adminkantor yang bisa akses.</div></div><div id="main" class="filterBox" style="display:none"><div class="filterTitle">Monitor Import</div><div id="status" class="smallHint">Memuat status...</div><div class="closingActions" style="margin-top:12px"><button type="button" onclick="reparseAll(this)">Reparse All</button></div><div id="audit" style="margin-top:14px"><div class="smallHint">Memuat audit Drive...</div></div></div></div>
<script>
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;")}
function reparse(id,btn){btn.disabled=true;hepiApi("/api/listings/reparse",{body:{fileId:id}}).then(function(){btn.textContent="Selesai"}).catch(function(e){btn.disabled=false;alert(e.message||e)})}
function reparseAll(btn){if(!confirm("Jalankan reparse semua listing? Proses berjalan di background dan bisa memakan waktu lama."))return;btn.disabled=true;btn.textContent="Berjalan...";hepiApi("/api/listings/reparse-all",{body:{}}).then(function(){load();}).catch(function(e){btn.disabled=false;btn.textContent="Reparse All";alert(e.message||e)})}
function renderAudit(d){d=d||{};var html='<div class="smallHint">Drive narasi: '+d.driveNarratives+' | Sheet rows: '+d.sheetRows+'</div>';function section(title,rows,action){rows=rows||[];html+='<h3 style="margin:18px 0 8px">'+title+' ('+rows.length+')</h3>';if(!rows.length){html+='<div class="smallHint">Tidak ada.</div>';return}html+='<div class="scoreTableWrap"><table class="scoreTable"><thead><tr><th>File</th><th>Folder/ID</th><th>Aksi</th></tr></thead><tbody>'+rows.map(function(x){var id=x.fileId||x.id||"";return '<tr><td>'+esc(x.fileName||x.name||id)+'</td><td>'+esc(x.folderLink||id)+'</td><td>'+(action?'<button type="button" onclick="reparse(\''+esc(id)+'\',this)">Reparse</button>':'-')+'</td></tr>'}).join('')+'</tbody></table></div>'}section('Belum ada di Sheet',d.missingInSheet,false);section('Sheet tanpa file Drive',(d.missingInDrive||[]).map(function(id){return{id:id}}),false);section('Nama file duplikat',d.duplicateNames,false);section('Harga kosong atau nol',d.zeroOrMissingPrice,true);$("audit").innerHTML=html}
function load(){$("main").style.display="block";hepiApi("/api/import/status").then(function(s){$("status").innerHTML='Last import: <b>'+esc(s.lastImportTime||"Belum ada")+'</b><br>Queue tersisa: <b>'+((s.queue&&s.queue.length)||0)+'</b>'}).catch(function(e){$("status").innerHTML='<span style="color:#b91c1c">Gagal membaca status: '+esc(e.message||e)+'</span>'});hepiApi("/api/import/audit").then(renderAudit).catch(function(e){$("audit").innerHTML='<div class="smallHint">Audit belum selesai: '+esc(e.message||e)+'</div>'})}
hepiAuth.onReady(function(){if(!hepiAuth.isLoggedIn())$("loginModal").style.display="block";else if(!hepiAuth.isListingEditor())$("deniedBox").style.display="block";else load()})
</script></body></html>
