<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0d47a1">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon-192.png">
  <title>Daily Activity</title>
  <link rel="stylesheet" href="/styles-v2.css">
  <script src="/js/hepi-api.js"></script>
  <script src="/js/hepi-auth.js"></script>
  <script src="/js/textsize.js"></script>
  <script>
    try {
      var _hepiText = localStorage.getItem("hepi_textSize");
      if (_hepiText === "large" || _hepiText === "xlarge") {
        document.documentElement.setAttribute("data-text-size", _hepiText);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="loginModal" class="sold-modal">
    <div class="sold-box">
      <h2>VERIFIKASI AKSES AGEN</h2>
      <div class="sold-text" style="margin-bottom:10px;">Login dulu untuk isi Daily Activity</div>
      <div class="sold-buttons">
        <button id="btnSubmitLogin" onclick="hepiAuth.login()" style="background:#1565c0;">Login dengan Google</button>
      </div>
    </div>
  </div>

  <div id="messageModal" class="sold-modal">
    <div class="sold-box">
      <div id="messageText" class="sold-text"></div>
      <button onclick="closeMessage()">OK</button>
    </div>
  </div>

  <div class="siteNav">
    <nav class="appNav">
      <a class="appNavLink" href="/" target="_top">Cari Listing</a>
      <a class="appNavLink active" href="/activity" target="_top">Aktivitas</a>
      <a class="appNavLink" href="/scores" target="_top">Skor</a>
      <a class="appNavLink" href="/history" target="_top">History</a>
      <a class="appNavLink" href="/form-listing" target="_top">Tambah Listing</a>
    </nav>
    <button class="headerLogout" onclick="doLogout()">Logout</button>
  </div>
  <div class="textSizeBar" role="group" aria-label="Ukuran teks">
    <span class="textSizeLabel">Ukuran Font</span>
    <button type="button" class="textSizeBtn" data-text-size-btn="normal">N</button>
    <button type="button" class="textSizeBtn" data-text-size-btn="large">L</button>
    <button type="button" class="textSizeBtn" data-text-size-btn="xlarge">XL</button>
  </div>

  <div class="pageWrap activityPage">
    <div class="filterBox">
      <div class="filterTitle">Aktivitas Harian</div>
      <div class="filterRow activityFields">
        <div class="specGroup specFull">
          <div class="specLabel">Nama</div>
          <input id="namaAgen" readonly placeholder="Login dulu">
        </div>
        <div class="specGroup specFull">
          <div class="specLabel">Tanggal Aktifitas</div>
          <input id="tanggal" type="date">
        </div>
        <div class="specGroup">
          <div class="specLabel">Listing</div>
          <input id="listing" class="countField" type="number" min="0" step="1" value="0">
        </div>
        <div class="specGroup">
          <div class="specLabel">Konten</div>
          <input id="konten" class="countField" type="number" min="0" step="1" value="0">
        </div>
        <div class="specGroup">
          <div class="specLabel">Posting IG dan Portal</div>
          <input id="posting" class="countField" type="number" min="0" step="1" value="0">
        </div>
        <div class="specGroup">
          <div class="specLabel">Survey Lokasi</div>
          <input id="survey" class="countField" type="number" min="0" step="1" value="0">
        </div>
      </div>
      <div class="formActions">
        <button id="btnSubmitActivity" onclick="submitActivity()">SIMPAN AKTIVITAS</button>
      </div>
      <div id="submitStatus" class="smallHint"></div>
    </div>
  </div>

<script>
  const SCRIPT_URL = "/";
  let dateAlreadyFilled = false;

  function $(id) { return document.getElementById(id); }

  function safeStr(v) { return String(v == null ? "" : v); }

  function todayInputValue() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function fillNama() {
    $("namaAgen").value = hepiAuth.getNama();
  }

  function setupCountFields() {
    const fields = document.querySelectorAll(".countField");
    for (let i = 0; i < fields.length; i++) {
      fields[i].addEventListener("focus", function() {
        if (this.value === "0") this.value = "";
      });
      fields[i].addEventListener("blur", function() {
        if (String(this.value).trim() === "") this.value = "0";
      });
    }
  }

  function countValue(id) {
    const raw = safeStr($(id).value).trim();
    if (!raw) return "0";
    return raw;
  }

  function openLogin() {
    $("loginModal").style.display = "block";
  }

  function closeLogin() {
    $("loginModal").style.display = "none";
  }

  function showMessage(msg) {
    $("messageText").textContent = msg;
    $("messageModal").style.display = "block";
  }

  function closeMessage() {
    $("messageModal").style.display = "none";
  }

  function setDateFilledState(filled, tanggal, hasClosing) {
    dateAlreadyFilled = !!filled;
    const btn = $("btnSubmitActivity");
    const status = $("submitStatus");
    if (filled) {
      btn.disabled = true;
      status.className = "alreadyBanner";
      status.textContent = "Tanggal " + (tanggal || "") + " sudah diisi. Tidak bisa submit lagi.";
    } else {
      btn.disabled = false;
      status.className = "smallHint";
      status.textContent = hasClosing
        ? "Closing sudah dicatat admin. Silakan isi aktivitas hari ini."
        : "";
    }
  }

  function checkSelectedDate() {
    if (!hepiAuth.isLoggedIn()) return;
    const tanggal = safeStr($("tanggal").value).trim();
    if (!tanggal) {
      setDateFilledState(false, "", false);
      return;
    }
    hepiApi("/api/activity/check", { body: { tanggal: tanggal } })
      .then(function(res) {
        setDateFilledState(res && res.filled, (res && res.tanggal) || tanggal, res && res.hasClosing);
      })
      .catch(function() {
        setDateFilledState(false, tanggal, false);
      });
  }

  function doLogout() {
    hepiAuth.logout();
  }

  function submitActivity() {
    if (!hepiAuth.isLoggedIn()) {
      openLogin();
      return;
    }

    const tanggal = safeStr($("tanggal").value).trim();
    if (!tanggal) {
      alert("Isi Tanggal Aktifitas dulu.");
      return;
    }

    if (dateAlreadyFilled) {
      showMessage("Tanggal " + tanggal + " sudah diisi. Tidak bisa submit lagi.");
      return;
    }

    const payload = {
      tanggal: tanggal,
      listing: countValue("listing"),
      konten: countValue("konten"),
      posting: countValue("posting"),
      survey: countValue("survey")
    };

    const btn = $("btnSubmitActivity");
    const original = btn.innerHTML;
    btn.innerHTML = "Menyimpan...";
    btn.disabled = true;
    $("submitStatus").textContent = "";

    hepiApi("/api/activity", { body: payload })
      .then(function(res) {
        if (res && res.ok) {
          try {
            localStorage.setItem("hepi_just_saved", JSON.stringify({
              ok: true,
              updated: !!res.updated,
              tanggal: res.tanggal || ""
            }));
          } catch (e) {}
          window.top.location.href = "/history";
          return;
        }
        btn.innerHTML = original;
        btn.disabled = false;
        if (res && res.alreadyFilled) {
          setDateFilledState(true, res.tanggal || tanggal);
          showMessage("Tanggal " + (res.tanggal || tanggal) + " sudah diisi. Tidak bisa submit lagi.");
          return;
        }
        $("submitStatus").className = "smallHint";
        $("submitStatus").textContent = "Gagal menyimpan.";
      })
      .catch(function(err) {
        btn.innerHTML = original;
        btn.disabled = false;
        const msg = err && err.message ? err.message : String(err);
        $("submitStatus").textContent = msg;
        if (/login|salah|ngawur/i.test(msg)) openLogin();
      });
  }

  $("tanggal").value = todayInputValue();
  $("tanggal").addEventListener("change", checkSelectedDate);
  setupCountFields();
  hepiAuth.onReady(function() {
    fillNama();
    if (!hepiAuth.isLoggedIn()) openLogin();
    else checkSelectedDate();
  });
</script>
</body>
</html>
