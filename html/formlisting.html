<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0d47a1">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon-192.png">
  <title>Form Listing</title>
  <link rel="stylesheet" href="/styles-v2.css">
  <script src="/js/hepi-api.js"></script>
  <script src="/js/textsize.js"></script>
  <script>
    try {
      var _hepiText = localStorage.getItem("hepi_textSize");
      if (_hepiText === "large" || _hepiText === "xlarge") {
        document.documentElement.setAttribute("data-text-size", _hepiText);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="loginModal" class="sold-modal">
    <div class="sold-box">
      <h2>VERIFIKASI AKSES AGEN</h2>
      <div class="sold-text" style="margin-bottom:10px;">Login dulu untuk kirim Form Listing</div>
      <div class="loginFields">
        <input id="loginAgentCode" placeholder="KODE AGEN" style="text-transform: uppercase;">
        <input id="loginPin" type="password" placeholder="PIN / PASSWORD">
        <div class="smallHint">Kode agen & PIN disimpan di browser ini.</div>
      </div>
      <div class="sold-buttons">
        <button id="btnSubmitLogin" onclick="submitLogin()" style="background:#1565c0;">Login</button>
      </div>
    </div>
  </div>

  <div id="previewModal" class="previewModal" onclick="if (event.target === this) closePreview();">
    <div class="previewBox">
      <button type="button" class="previewClose" onclick="closePreview()">Tutup ✕</button>
      <div id="previewBody" class="previewBody"></div>
    </div>
  </div>

  <div class="siteNav">
    <nav class="appNav">
      <a class="appNavLink" href="/" target="_top">Cari Listing</a>
      <a class="appNavLink" href="/activity" target="_top">Aktivitas</a>
      <a class="appNavLink" href="/scores" target="_top">Skor</a>
      <a class="appNavLink" href="/history" target="_top">History</a>
      <a class="appNavLink active" href="/form-listing" target="_top">Tambah Listing</a>
    </nav>
    <button class="headerLogout" onclick="doLogout()">Logout</button>
  </div>
  <div class="textSizeBar" role="group" aria-label="Ukuran teks">
    <span class="textSizeLabel">Ukuran Font</span>
    <button type="button" class="textSizeBtn" data-text-size-btn="normal">N</button>
    <button type="button" class="textSizeBtn" data-text-size-btn="large">L</button>
    <button type="button" class="textSizeBtn" data-text-size-btn="xlarge">XL</button>
  </div>

  <div class="pageWrap">
    <div class="filterBox">
      <div class="filterTitle" id="formTitle">Kirim Form Listing</div>
      <div id="editHint" class="smallHint" style="display:none;">Mode edit: kirim ulang file yang perlu diperbaiki saja, atau ganti narasi.</div>
      <div id="listingCards"></div>
      <div class="formActions">
        <button type="button" id="btnAddCard" class="btnSecondary" onclick="addListingCard()">+ Tambah Listing Lagi</button>
      </div>
      <div class="formActions">
        <button type="button" id="btnCancelEdit" class="btnSecondary" onclick="cancelEdit()" style="display:none;">BATAL EDIT</button>
        <button type="button" id="btnSubmitForm" onclick="submitForm()">KIRIM</button>
      </div>
      <div id="submitStatus" class="smallHint"></div>
    </div>

    <div class="filterBox">
      <div class="filterTitle">Riwayat Submission Saya</div>
      <div id="historyArea"></div>
    </div>
  </div>

<script>
  const SCRIPT_URL = "/";
  let myRows = [];
  let editingFileId = null;

  function $(id) { return document.getElementById(id); }
  function safeStr(v) { return String(v == null ? "" : v); }
  function escapeHtml(str) {
    return safeStr(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function getStoredAgentCode() { return localStorage.getItem("hepi_agentCode") || ""; }
  function getStoredPin() { return localStorage.getItem("hepi_pin") || ""; }

  function saveSession(agentCode, pin, status, nama) {
    try {
      localStorage.setItem("hepi_agentCode", safeStr(agentCode).toUpperCase().trim());
      localStorage.setItem("hepi_pin", safeStr(pin).trim());
      localStorage.setItem("hepi_status", safeStr(status).toLowerCase().trim());
      localStorage.setItem("hepi_nama", safeStr(nama).trim());
    } catch (e) {}
  }

  function isLoggedIn() {
    return !!(getStoredAgentCode() && getStoredPin());
  }

  function openLogin() { $("loginModal").style.display = "block"; }
  function closeLogin() { $("loginModal").style.display = "none"; }

  function doLogout() {
    try {
      localStorage.removeItem("hepi_agentCode");
      localStorage.removeItem("hepi_pin");
      localStorage.removeItem("hepi_status");
      localStorage.removeItem("hepi_nama");
    } catch (e) {}
    window.top.location.href = "/";
  }

  function submitLogin() {
    const code = safeStr($("loginAgentCode").value).toUpperCase().trim();
    const pin = safeStr($("loginPin").value).trim();
    if (!code || !pin) {
      alert("Hayoo isi Kode Agen dan PIN Anda!");
      return;
    }

    const btn = $("btnSubmitLogin");
    const original = btn.innerHTML;
    btn.innerHTML = "Memeriksa...";
    btn.disabled = true;

    hepiApi("/api/login", { body: { agentCode: code, pin: pin } })
      .then(function(res) {
        btn.innerHTML = original;
        btn.disabled = false;
        if (res && res.valid) {
          saveSession(code, pin, res.status, res.nama);
          closeLogin();
          loadMine();
        } else {
          alert("Akses ditolak: " + (res && res.pesan ? res.pesan : "Login gagal"));
          $("loginPin").value = "";
        }
      })
      .catch(function(err) {
        btn.innerHTML = original;
        btn.disabled = false;
        alert("Salahkan jaringan: " + (err && err.message ? err.message : err));
      });
  }

  function updatePreviewButton(card, which) {
    const btn = card.querySelector(which === "form" ? ".btnPreviewForm" : ".btnPreviewProperty");
    btn.style.display = card._preview[which] ? "inline-flex" : "none";
  }

  function setLocalPreview(card, which, file) {
    const prev = card._preview[which];
    if (prev && prev.kind === "local" && prev.url) URL.revokeObjectURL(prev.url);
    card._preview[which] = file ? { kind: "local", url: URL.createObjectURL(file), mime: file.type } : null;
    updatePreviewButton(card, which);
  }

  function setRemotePreview(card, which, fileId, mime) {
    const prev = card._preview[which];
    if (prev && prev.kind === "local" && prev.url) URL.revokeObjectURL(prev.url);
    card._preview[which] = fileId ? { kind: "remote", fileId: fileId, mime: mime } : null;
    updatePreviewButton(card, which);
  }

  function revokeCardPreviews(card) {
    ["form", "property"].forEach(function(w) {
      const p = card._preview && card._preview[w];
      if (p && p.kind === "local" && p.url) URL.revokeObjectURL(p.url);
    });
  }

  function previewCardFile(card, which) {
    const p = card._preview[which];
    if (!p) return;
    const isPdf = String(p.mime || "").indexOf("pdf") >= 0;
    const body = $("previewBody");
    if (p.kind === "local") {
      body.innerHTML = isPdf ? '<iframe src="' + p.url + '"></iframe>' : '<img src="' + p.url + '" alt="preview">';
    } else {
      body.innerHTML = isPdf
        ? '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(p.fileId) + '/preview"></iframe>'
        : '<img src="https://lh3.googleusercontent.com/d/' + encodeURIComponent(p.fileId) + '=w1600" alt="preview">';
    }
    $("previewModal").style.display = "block";
  }

  function closePreview() {
    $("previewModal").style.display = "none";
    $("previewBody").innerHTML = "";
  }

  function previewNarasi(fileId) {
    const row = myRows.find(function(r) { return r.fileId === fileId; });
    if (!row) return;
    $("previewBody").innerHTML = '<div class="narasiPreviewText">' + escapeHtml(row.narasi || "") + '</div>';
    $("previewModal").style.display = "block";
  }

  function openPreview(fileId, kind) {
    const body = $("previewBody");
    if (kind === "pdf") {
      body.innerHTML = '<iframe src="https://drive.google.com/file/d/' + encodeURIComponent(fileId) + '/preview"></iframe>';
    } else {
      body.innerHTML = '<img src="https://lh3.googleusercontent.com/d/' + encodeURIComponent(fileId) + '=w1600" alt="preview">';
    }
    $("previewModal").style.display = "block";
  }

  function refreshRemoveButtons() {
    const cards = document.querySelectorAll("#listingCards .listingCard");
    cards.forEach(function(card) {
      const btn = card.querySelector(".btnRemoveCard");
      if (btn) btn.style.display = cards.length > 1 ? "block" : "none";
    });
  }

  function addListingCard() {
    const wrap = $("listingCards");
    const card = document.createElement("div");
    card.className = "listingCard";
    card._preview = { form: null, property: null };
    card.innerHTML =
      '<div class="listingCardHead">'
      + '<div class="listingCardTitle">Listing</div>'
      + '<button type="button" class="btnDanger btnRemoveCard">Hapus</button>'
      + '</div>'
      + '<div class="filterRow">'
      + '<div class="specGroup"><div class="specLabel">Foto Form Fisik (foto/PDF)</div>'
      + '<div class="fileRow"><input class="formFileInput" type="file" accept="image/*,application/pdf">'
      + '<button type="button" class="queueIconBtn btnPreviewForm" style="display:none;" title="Lihat">👁️</button></div></div>'
      + '<div class="specGroup"><div class="specLabel">Foto Property</div>'
      + '<div class="fileRow"><input class="propertyFileInput" type="file" accept="image/*">'
      + '<button type="button" class="queueIconBtn btnPreviewProperty" style="display:none;" title="Lihat">👁️</button></div></div>'
      + '</div>'
      + '<div class="specGroup judulGroup" style="margin-top:16px;">'
      + '<div class="specLabel">Judul (opsional)</div>'
      + '<input class="judulInput" type="text" placeholder="Judul"></div>'
      + '<div class="specGroup" style="margin-top:16px;">'
      + '<div class="specLabel">Narasi (opsional)</div>'
      + '<textarea class="narasiInput" placeholder="Narasi listing"></textarea></div>';

    card.querySelector(".formFileInput").addEventListener("change", function() {
      setLocalPreview(card, "form", this.files[0] || null);
    });
    card.querySelector(".propertyFileInput").addEventListener("change", function() {
      setLocalPreview(card, "property", this.files[0] || null);
    });
    card.querySelector(".btnPreviewForm").addEventListener("click", function() { previewCardFile(card, "form"); });
    card.querySelector(".btnPreviewProperty").addEventListener("click", function() { previewCardFile(card, "property"); });
    card.querySelector(".btnRemoveCard").addEventListener("click", function() {
      const all = document.querySelectorAll("#listingCards .listingCard");
      if (all.length <= 1) return;
      revokeCardPreviews(card);
      card.remove();
      refreshRemoveButtons();
    });

    wrap.appendChild(card);
    refreshRemoveButtons();
    return card;
  }

  function resetListingCards() {
    document.querySelectorAll("#listingCards .listingCard").forEach(revokeCardPreviews);
    $("listingCards").innerHTML = "";
    $("btnAddCard").style.display = "";
    addListingCard();
  }

  function ensureFirstCard() {
    if (!document.querySelector("#listingCards .listingCard")) addListingCard();
  }

  function statusPillHtml(status) {
    const s = safeStr(status);
    const cls = s === "selesai" ? "queueStatusSelesai" : (s === "revisi" ? "queueStatusRevisi" : "queueStatusPending");
    const label = s === "selesai" ? "Selesai" : (s === "revisi" ? "Perlu Revisi" : "Menunggu");
    return '<span class="' + cls + '">' + escapeHtml(label) + '</span>';
  }

  function startEdit(fileId) {
    const row = myRows.find(function(r) { return r.fileId === fileId; });
    if (!row) return;
    editingFileId = fileId;
    document.querySelectorAll("#listingCards .listingCard").forEach(revokeCardPreviews);
    $("listingCards").innerHTML = "";
    const card = addListingCard();
    card.querySelector(".btnRemoveCard").style.display = "none";
    card.querySelector(".judulGroup").style.display = "none";
    card.querySelector(".narasiInput").value = row.narasi || "";
    setRemotePreview(card, "form", row.formFileId, row.formMime);
    setRemotePreview(card, "property", row.propertyFileId, "image/jpeg");
    $("btnAddCard").style.display = "none";
    $("formTitle").textContent = "Edit Submission (" + row.tanggal + ")";
    $("editHint").style.display = "block";
    $("btnCancelEdit").style.display = "block";
    $("submitStatus").className = "smallHint";
    $("submitStatus").textContent = "";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function cancelEdit() {
    editingFileId = null;
    $("formTitle").textContent = "Kirim Form Listing";
    $("editHint").style.display = "none";
    $("btnCancelEdit").style.display = "none";
    resetListingCards();
  }

  let doneVisible = false;

  function historyRowHtml(r) {
    const canEdit = r.status !== "selesai";
    const isPdf = r.formMime === "application/pdf";
    return '<tr>'
      + '<td>' + escapeHtml(r.tanggal) + '</td>'
      + '<td>' + statusPillHtml(r.status) + '</td>'
      + '<td>' + (r.narasi ? '<button type="button" class="queueIconBtn" title="Lihat narasi" onclick="previewNarasi(\'' + escapeHtml(r.fileId) + '\')">📃</button>' : "—") + '</td>'
      + '<td>' + (r.formFileId ? '<button type="button" class="queueIconBtn" title="Lihat form fisik" onclick="openPreview(\'' + escapeHtml(r.formFileId) + '\', \'' + (isPdf ? "pdf" : "image") + '\')">' + (isPdf ? "📄" : "🖼️") + '</button>' : "—") + '</td>'
      + '<td>' + (r.propertyFileId ? '<button type="button" class="queueIconBtn" title="Lihat foto property" onclick="openPreview(\'' + escapeHtml(r.propertyFileId) + '\', \'image\')">📷</button>' : "—") + '</td>'
      + '<td>' + (r.feedback ? escapeHtml(r.feedback) : "—") + '</td>'
      + '<td>' + (canEdit ? '<button type="button" class="queueTextBtn" onclick="startEdit(\'' + escapeHtml(r.fileId) + '\')">Edit</button>' : "—") + '</td>'
      + '</tr>';
  }

  function historyTableHtml(rows) {
    return '<table class="scoreTable queueTable"><thead><tr>'
      + '<th>Tanggal</th><th>Status</th><th>Narasi</th><th>Form</th><th>Foto</th><th>Feedback</th><th>Aksi</th>'
      + '</tr></thead><tbody>' + rows.map(historyRowHtml).join("") + '</tbody></table>';
  }

  function toggleDoneHistory() {
    doneVisible = !doneVisible;
    renderHistory();
  }

  function renderHistory() {
    if (!myRows.length) {
      $("historyArea").innerHTML = '<div class="emptyState">Belum ada submission.</div>';
      return;
    }
    const active = myRows.filter(function(r) { return r.status !== "selesai"; });
    const done = myRows.filter(function(r) { return r.status === "selesai"; });

    let html = '<div class="scoreTableWrap">' + (active.length ? historyTableHtml(active) : '<div class="emptyState">Tidak ada submission aktif.</div>') + '</div>';

    if (done.length) {
      html += '<button type="button" class="btnSecondary" style="margin-top:14px;" onclick="toggleDoneHistory()">'
        + (doneVisible ? "▾ Sembunyikan" : "▸ Tampilkan") + ' ' + done.length + ' Selesai</button>';
      if (doneVisible) {
        html += '<div class="scoreTableWrap" style="margin-top:10px;">' + historyTableHtml(done) + '</div>';
      }
    }
    $("historyArea").innerHTML = html;
  }

  function loadMine() {
    if (!isLoggedIn()) {
      openLogin();
      return;
    }
    $("historyArea").innerHTML = '<div class="emptyState">Memuat...</div>';
    hepiApi("/api/form-listing/mine", { body: { agentCode: getStoredAgentCode(), pin: getStoredPin() } })
      .then(function(res) {
        myRows = (res && res.rows) || [];
        renderHistory();
      })
      .catch(function(err) {
        const msg = err && err.message ? err.message : String(err);
        $("historyArea").innerHTML = '<div class="emptyState">' + escapeHtml(msg) + '</div>';
        if (/login|salah|ngawur/i.test(msg)) openLogin();
      });
  }

  function collectCardPayload(card) {
    const formFile = card.querySelector(".formFileInput").files[0] || null;
    const propertyFile = card.querySelector(".propertyFileInput").files[0] || null;
    const judul = safeStr(card.querySelector(".judulInput").value).trim();
    const narasi = safeStr(card.querySelector(".narasiInput").value).trim();

    if (!editingFileId) {
      if (!formFile) throw new Error("Upload Foto Form Fisik (foto atau PDF).");
      if (!propertyFile) throw new Error("Upload Foto Property.");
    } else if (!formFile && !propertyFile && !narasi) {
      throw new Error("Tidak ada perubahan untuk disimpan.");
    }

    return { formFile: formFile, propertyFile: propertyFile, judul: judul, narasi: narasi };
  }

  function runSubmitCard(payload) {
    const fd = new FormData();
    fd.append("agentCode", getStoredAgentCode());
    fd.append("pin", getStoredPin());
    fd.append("judul", payload.judul);
    fd.append("narasi", payload.narasi);
    if (payload.formFile) fd.append("form", payload.formFile, payload.formFile.name);
    if (payload.propertyFile) fd.append("property", payload.propertyFile, payload.propertyFile.name);
    if (editingFileId) fd.append("fileId", editingFileId);
    return hepiApi(editingFileId ? "/api/form-listing/edit" : "/api/form-listing/submit", { formData: fd });
  }

  function submitForm() {
    if (!isLoggedIn()) {
      openLogin();
      return;
    }

    const cards = Array.prototype.slice.call(document.querySelectorAll("#listingCards .listingCard"));
    let payloads;
    try {
      payloads = cards.map(collectCardPayload);
    } catch (err) {
      alert(err && err.message ? err.message : String(err));
      return;
    }

    const btn = $("btnSubmitForm");
    const original = btn.innerHTML;
    btn.disabled = true;
    $("btnAddCard").disabled = true;
    $("submitStatus").className = "smallHint";
    $("submitStatus").textContent = "";

    let i = 0;
    let savedCount = 0;

    function next() {
      if (i >= payloads.length) {
        btn.innerHTML = original;
        btn.disabled = false;
        $("btnAddCard").disabled = false;
        $("submitStatus").className = "successBanner";
        $("submitStatus").textContent = editingFileId
          ? "Perubahan tersimpan, menunggu review lagi."
          : (payloads.length > 1 ? savedCount + " listing terkirim, menunggu review adminkantor." : "Form listing terkirim, menunggu review adminkantor.");
        cancelEdit();
        loadMine();
        return;
      }
      btn.innerHTML = payloads.length > 1 ? "Menyimpan " + (i + 1) + "/" + payloads.length + "..." : "Mengirim...";
      runSubmitCard(payloads[i])
        .then(function(res) {
          if (!res || !res.ok) throw new Error("Gagal menyimpan listing " + (i + 1) + ".");
          savedCount += 1;
          i += 1;
          next();
        })
        .catch(function(err) {
          btn.innerHTML = original;
          btn.disabled = false;
          $("btnAddCard").disabled = false;
          const msg = err && err.message ? err.message : String(err);
          $("submitStatus").className = "smallHint";
          const prefix = savedCount ? savedCount + " listing tersimpan. " : "";
          $("submitStatus").textContent = prefix + "Listing " + (i + 1) + " gagal: " + msg;
          if (/login|salah|ngawur/i.test(msg)) openLogin();
        });
    }

    next();
  }

  ensureFirstCard();
  if (isLoggedIn()) loadMine();
  else openLogin();
</script>
</body>
</html>
