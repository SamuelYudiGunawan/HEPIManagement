<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta name="theme-color" content="#0d47a1">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon-192.png">
  <title>Closing</title>
  <link rel="stylesheet" href="/styles-v2.css">
  <script src="/js/hepi-api.js"></script>
  <script src="/js/hepi-auth.js"></script>
  <script src="/js/textsize.js"></script>
</head>
<body>
  <div id="loginModal" class="sold-modal">
    <div class="sold-box">
      <h2>VERIFIKASI AKSES AGEN</h2>
      <div class="sold-text" style="margin-bottom:10px;">Login admin untuk isi Closing</div>
      <div class="sold-buttons">
        <button id="btnSubmitLogin" onclick="hepiAuth.login()" style="background:#1565c0;">Login dengan Google</button>
      </div>
    </div>
  </div>

  <div id="messageModal" class="sold-modal">
    <div class="sold-box">
      <div id="messageText" class="sold-text"></div>
      <button onclick="closeMessage()">OK</button>
    </div>
  </div>

  <div class="siteNav">
    <nav class="appNav">
      <a class="appNavLink" href="/" target="_top">Cari Listing</a>
      <a class="appNavLink" href="/activity" target="_top">Aktivitas</a>
      <a class="appNavLink" href="/scores" target="_top">Skor</a>
      <a class="appNavLink" href="/history" target="_top">History</a>
      <a class="appNavLink" href="/form-listing" target="_top">Tambah Listing</a>
    </nav>
    <button class="headerLogout" onclick="doLogout()">Logout</button>
  </div>

  <div class="pageWrap">
    <div id="deniedBox" class="filterBox" style="display:none;">
      <div class="emptyState">Hanya admin yang bisa akses halaman Closing.</div>
    </div>

    <div id="formBox" class="filterBox" style="display:none;">
      <div class="filterTitle">Input Closing</div>

      <div id="agentRows"></div>

      <div class="closingActions">
        <button type="button" id="btnAddAgent" class="btnSecondary" onclick="addAgentRow()">+ Add more agent</button>
        <button type="button" id="btnSaveClosing" onclick="submitClosing()">SIMPAN</button>
      </div>
      <div id="submitStatus" class="smallHint"></div>
    </div>
  </div>

<script>
  const SCRIPT_URL = "/";
  let AGENT_LIST = [];

  function $(id) { return document.getElementById(id); }

  function safeStr(v) { return String(v == null ? "" : v); }

  function escapeHtml(str) {
    return safeStr(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function todayInputValue() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function openLogin() { $("loginModal").style.display = "block"; }
  function closeLogin() { $("loginModal").style.display = "none"; }

  function showMessage(msg) {
    $("messageText").textContent = msg;
    $("messageModal").style.display = "block";
  }

  function closeMessage() { $("messageModal").style.display = "none"; }

  function doLogout() {
    hepiAuth.logout();
  }

  function agentOptionsHtml(selected) {
    const sel = safeStr(selected);
    let html = '<option value="">Pilih agen</option>';
    AGENT_LIST.forEach(function(a) {
      const kode = safeStr(a.kode);
      const nama = safeStr(a.nama || a.kode);
      html += '<option value="' + escapeHtml(kode) + '"'
        + (kode === sel ? " selected" : "")
        + ">" + escapeHtml(nama) + "</option>";
    });
    return html;
  }

  function bindJumlahField(input) {
    input.addEventListener("focus", function() {
      if (this.value === "0") this.value = "";
    });
    input.addEventListener("blur", function() {
      if (String(this.value).trim() === "") this.value = "0";
    });
  }

  function refreshRemoveButtons() {
    const rows = document.querySelectorAll("#agentRows .closingRow");
    rows.forEach(function(row) {
      const btn = row.querySelector(".btnRemove");
      if (btn) btn.style.display = rows.length > 1 ? "block" : "none";
    });
  }

  function addAgentRow(selectedKode, selectedTanggal) {
    if (!selectedTanggal) {
      const existing = document.querySelectorAll("#agentRows .closingRow");
      if (existing.length) {
        const lastDate = existing[existing.length - 1].querySelector(".tanggalInput");
        if (lastDate && lastDate.value) selectedTanggal = lastDate.value;
      }
    }
    selectedTanggal = selectedTanggal || todayInputValue();
    const wrap = $("agentRows");
    const row = document.createElement("div");
    row.className = "closingRow";
    row.innerHTML =
      '<div class="specGroup">'
      + '<div class="specLabel">Tanggal Closing</div>'
      + '<input class="tanggalInput" type="date" value="' + escapeHtml(selectedTanggal || todayInputValue()) + '">'
      + "</div>"
      + '<div class="specGroup">'
      + '<div class="specLabel">Agent Closing</div>'
      + '<select class="agentSelect">' + agentOptionsHtml(selectedKode) + "</select>"
      + "</div>"
      + '<div class="specGroup">'
      + '<div class="specLabel">Jumlah Closing</div>'
      + '<input class="jumlahInput" type="number" min="0" step="1" value="0">'
      + "</div>"
      + '<button type="button" class="btnDanger btnRemove">Hapus</button>';

    const jumlah = row.querySelector(".jumlahInput");
    bindJumlahField(jumlah);

    row.querySelector(".btnRemove").addEventListener("click", function() {
      const all = document.querySelectorAll("#agentRows .closingRow");
      if (all.length <= 1) return;
      row.remove();
      refreshRemoveButtons();
    });

    wrap.appendChild(row);
    refreshRemoveButtons();
  }

  function fillAgentSelects() {
    const selects = document.querySelectorAll("#agentRows .agentSelect");
    for (let i = 0; i < selects.length; i++) {
      const current = selects[i].value;
      selects[i].innerHTML = agentOptionsHtml(current);
    }
  }

  function ensureFirstRow() {
    if (!document.querySelector("#agentRows .closingRow")) addAgentRow();
  }

  function resetAgentRows() {
    $("agentRows").innerHTML = "";
    addAgentRow();
  }

  function showDenied() {
    $("deniedBox").style.display = "block";
    $("formBox").style.display = "none";
  }

  function showForm() {
    $("deniedBox").style.display = "none";
    $("formBox").style.display = "block";
  }

  function loadAgentsThenForm() {
    showForm();
    ensureFirstRow();
    $("submitStatus").className = "smallHint";
    $("submitStatus").textContent = "";

    hepiApi("/api/agents", { body: { for: "closing" } })
      .then(function(list) {
        AGENT_LIST = Array.isArray(list) ? list : [];
        fillAgentSelects();
        ensureFirstRow();
        if (!AGENT_LIST.length) {
          $("submitStatus").className = "formHint";
          $("submitStatus").textContent = "Belum ada agen aktif di Data Agen.";
        }
      })
      .catch(function(err) {
        const msg = err && err.message ? err.message : String(err);
        $("submitStatus").textContent = msg;
        $("btnSaveClosing").disabled = false;
        $("btnAddAgent").disabled = false;
        if (/admin|akses/i.test(msg)) showDenied();
        if (/login|salah|ngawur/i.test(msg)) openLogin();
      });
  }

  function applyAccess() {
    if (!hepiAuth.isLoggedIn()) {
      $("deniedBox").style.display = "none";
      $("formBox").style.display = "none";
      openLogin();
      return;
    }
    if (!hepiAuth.isAdmin()) {
      showDenied();
      return;
    }
    loadAgentsThenForm();
  }

  function submitClosing() {
    if (!hepiAuth.isLoggedIn()) {
      openLogin();
      return;
    }
    if (!hepiAuth.isAdmin()) {
      showDenied();
      return;
    }

    const rows = document.querySelectorAll("#agentRows .closingRow");
    const items = [];
    const seen = {};
    for (let i = 0; i < rows.length; i++) {
      const tanggal = safeStr(rows[i].querySelector(".tanggalInput").value).trim();
      const kode = safeStr(rows[i].querySelector(".agentSelect").value).trim();
      const jumlahRaw = safeStr(rows[i].querySelector(".jumlahInput").value).trim();
      if (!kode && !tanggal) continue;
      if (!kode) {
        alert("Baris " + (i + 1) + ": pilih Agent Closing.");
        return;
      }
      if (!tanggal) {
        alert("Baris " + (i + 1) + ": isi Tanggal Closing.");
        return;
      }
      const key = kode + "|" + tanggal;
      if (seen[key]) {
        alert("Agen yang sama tidak boleh diisi dua kali untuk tanggal yang sama.");
        return;
      }
      seen[key] = true;
      items.push({
        tanggal: tanggal,
        kode: kode,
        jumlah: jumlahRaw === "" ? 0 : jumlahRaw
      });
    }

    if (!items.length) {
      alert("Isi minimal satu baris: tanggal, agen, dan jumlah closing.");
      return;
    }

    const btn = $("btnSaveClosing");
    const original = btn.innerHTML;
    btn.innerHTML = "Menyimpan...";
    btn.disabled = true;
    $("submitStatus").className = "smallHint";
    $("submitStatus").textContent = "";

    hepiApi("/api/closings", { body: { items: items } })
      .then(function(res) {
        btn.innerHTML = original;
        btn.disabled = false;
        if (res && res.ok) {
          const names = (res.saved || []).map(function(s) {
            return (s.nama || s.kode) + " " + (s.tanggal || "") + " (" + s.jumlah + ")";
          }).join(", ");
          $("submitStatus").className = "successBanner";
          $("submitStatus").textContent = "Closing tersimpan: " + names;
          resetAgentRows();
          showMessage("Closing berhasil disimpan.");
          return;
        }
        $("submitStatus").textContent = "Gagal menyimpan.";
      })
      .catch(function(err) {
        btn.innerHTML = original;
        btn.disabled = false;
        const msg = err && err.message ? err.message : String(err);
        $("submitStatus").className = "smallHint";
        $("submitStatus").textContent = msg;
        if (/admin|akses/i.test(msg)) showDenied();
        if (/login|salah|ngawur/i.test(msg)) openLogin();
      });
  }

  hepiAuth.onReady(applyAccess);
</script>
</body>
</html>
